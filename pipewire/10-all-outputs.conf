# Virtual sink "All Outputs". Everything played into it goes to every real
# output (analog, USB, Bluetooth) at the same time. New devices are picked up
# as they appear. Installed by the All Outputs plugin for Omarchy.
context.modules = [
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "combine_all_outputs"
            node.description = "All Outputs"

            # Bluetooth lags a couple hundred ms behind wired. Without this two
            # people on two devices hear the same audio slightly apart.
            combine.latency-compensate = true

            combine.props = {
                audio.position = [ FL FR ]

                # WirePlumber picks a new default sink every time a device
                # connects, by priority.session. Real devices sit around 1000.
                # With no priority this sink lost every time and playback went
                # to whatever was just plugged in. These only work inside
                # combine.props, at the top level they never reach the node.
                priority.session = 3000
                priority.driver = 3000
            }

            stream.rules = [
                {   matches = [
                        {   media.class = "Audio/Sink"
                            node.name = "~(alsa_output|bluez_output)\\..*"
                        }
                    ]
                    actions = {
                        create-stream = {
                            # Keep the per device streams at 100%. Volume for
                            # each device lives on the device itself, otherwise
                            # there are two knobs for one speaker.
                            state.restore-props = false
                        }
                    }
                }
            ]
        }
    }
]
